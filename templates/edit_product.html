{% extends "base.html" %}{% block title %}Edit Product{% endblock %}{% block content %}<main class="container narrow top-space"><section class="card"><span class="eyebrow">ADMIN PANEL</span><h1>Product Edit</h1><form method="POST" enctype="multipart/form-data"><label>Product naam<input name="name" value="{{ product.name }}" required></label><div class="form-grid"><label>Price ₹<input type="number" name="price" value="{{ product.price }}" min="1" required></label><label>Stock<input type="number" name="stock" value="{{ product.stock }}" min="0" required></label></div><label>Shop naam<input name="shop_name" value="{{ product.shop_name }}" required></label><label>Category<input name="category" value="{{ product.category }}" required></label>{% if product.image_url %}<img class="edit-preview" src="{{ url_for('static',filename='uploads/'+product.image_url) }}" alt="">{% endif %}<label>Nayi photo optional<input type="file" name="image" accept=".png,.jpg,.jpeg,.webp,image/*"></label><label class="check-row"><input type="checkbox" name="is_featured" {% if product.is_featured %}checked{% endif %}> Featured product</label><button>Save Changes</button> <a class="button secondary" href="{{ url_for('admin_products') }}">Cancel</a></form></section></main>{% endblock %}
